
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #f6f6f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      gap: 50px;
    }

    /* Left Section */
    .left {
      width: 450px;
      margin-top: 70px;
      display: inline-block;
    }

    .left img {
      width: 300px;
      margin-left: -28px;
    }

    .left p {
      font-size: 24px;
      line-height: 1.3;
      margin-top: 0;
    }

    /* Right Section */
    .right {
      width: 300px;
    }

    form {
      display: flex;
      width: 300px;
      background-color: white;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px #ccc;
      flex-direction: column;
      gap: 10px;
    }

    input {
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      font-size: 16px;
      width: 100%;
    }

    button {
      background-color: #1877f2;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    a {
      text-decoration: none;
      color: #1877f2;
      text-align: center;
      font-size: 14px;
      margin-top: 10px;
    }

    .signup {
      background-color: #42b72a;
      margin-top: 20px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        padding: 30px 15px;
        gap: 20px;
      }

      .left {
        width: 100%;
        max-width: 450px;
        margin-top: 0;
        text-align: center;
      }

      .left img {
        margin-left: 0;
        max-width: 100%;
      }

      .right {
        width: 300px;
        max-width: 100%;
      }

      form {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Left Section -->
  <div class="left">
    <img
      src="https://static.xx.fbcdn.net/rsrc.php/y8/r/dF5SId3UHWd.svg"
      alt="Facebook logo"
    >

    <p>
      Facebook helps you connect and share
      with the people in your life.
    </p>
  </div>

  <!-- Right Section -->
  <div class="right">

    <form action="#" method="get">

      <input
        type="text"
        id="email"
        placeholder="Email address or phone number"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        Log in
      </button>

      <a href="#">
        Forgotten account?
      </a>

    </form>

    <button type="button" class="signup">
      Create new account
    </button>

  </div>

</body>
</html>
